services:
  medical-notice-analyzer:
    image: medical-notice-analyzer:s3-9402a00
    environment:
      APP_GIT_SHA: 9402a00a1c98ba6b006d289c93b8a340bf245787
      ENABLE_VBP_REPORT_RULES: "true"
      ENABLE_EVIDENCE_INDEX: "true"
      ENABLE_VBP_QUALITY_GATE: "true"
      ENABLE_UNSUPPORTED_FACT_REPAIR: "true"
      ENABLE_STRICT_DELIVERY_GATE: "true"
      ENABLE_CONCURRENT_ATTACHMENT_PARSE: "false"
      ATTACHMENT_PARSE_CONCURRENCY: "3"
      ENABLE_COMPACT_CACHE: "false"
      COMPACT_CACHE_DIR: /app/data/compact_cache
      COMPACT_CACHE_TTL_SECONDS: "604800"
      COMPACT_CACHE_MAX_ENTRY_BYTES: "2097152"
      COMPACT_RULE_VERSION: 20260716-s3c-v1
