services:
  medical-notice-analyzer:
    image: ${S4_IMAGE:?S4_IMAGE is required}
    environment:
      APP_GIT_SHA: ${S4_GIT_SHA:?S4_GIT_SHA is required}
      WEB_CONCURRENCY: "1"
      UVICORN_WORKERS: "1"
      ENABLE_VBP_REPORT_RULES: "true"
      ENABLE_EVIDENCE_INDEX: "true"
      ENABLE_VBP_QUALITY_GATE: "true"
      ENABLE_UNSUPPORTED_FACT_REPAIR: "false"
      ENABLE_STRICT_DELIVERY_GATE: "true"
      ENABLE_CONCURRENT_ATTACHMENT_PARSE: "true"
      ATTACHMENT_PARSE_CONCURRENCY: "2"
      ATTACHMENT_TASK_TIMEOUT_SECONDS: "180"
      ENABLE_ATTACHMENT_TASK_PROCESS_ISOLATION: "true"
      ENABLE_COMPACT_CACHE: "true"
      COMPACT_CACHE_DIR: /app/data/compact_cache
      COMPACT_CACHE_TTL_SECONDS: "604800"
      COMPACT_CACHE_MAX_ENTRY_BYTES: "2097152"
      COMPACT_RULE_VERSION: 20260716-s3c-v1
      ENABLE_ANALYSIS_HISTORY: "true"
      ENABLE_ANALYSIS_HISTORY_UI: "true"
      ENABLE_RUN_CHECKPOINTS: "true"
      ENABLE_RUN_RECOVERY: "true"
